[profile.default]
src = 'contracts'
out = 'forge/out'
libs = ['node_modules', 'forge/lib']
test = 'forge/test'
cache_path  = 'forge/cache'

# disable for CI (used for debugging liquidity issues)
no_match_test = "test.*SwapVia"

evm_version = "cancun"
solc_version = "0.8.15"

optimizer = true
optimizer_runs = 1
via_ir = true

[profile.default.optimizer_details]
yul = true

[profile.default.optimizer_details.yulDetails]
optimizerSteps = 'dhfoDgvulfnTUtnIf [xa[r]scLM cCTUtTOntnfDIul Lcul Vcul [j] Tpeul xa[rul] xa[r]cL gvif CTUca[r]LsTOtfDnca[r]Iulc] jmul[jul] VcTOcul jmul'

remappings = [
    "@forge-std/=forge/lib/forge-std/",
    "@comet-contracts/=contracts/",
]

# Fuzzing runs on its own test root: the deployment tests under forge/test reference
# contracts/Comet.sol, which this branch does not carry, so they would not compile.
# TODO: change when the rest of the forge tests will be fixed
[profile.fuzz]
test = 'forge/test/fuzzing'
# Narrowed to our own files. forge-std ships a suite of its own that needs filesystem permissions and
# RPC endpoints this repo does not grant it, and it is discovered through the library path regardless
# of the test root above.
match_path = 'forge/test/fuzzing/**'

[profile.fuzz.fuzz]
runs = 2000
seed = "0xdead"

[rpc_endpoints]
mainnet = "${MAINNET_QUICKNODE_LINK}"
polygon = "${POLYGON_QUICKNODE_LINK}"
arbitrum = "${ARBITRUM_QUICKNODE_LINK}"
optimism = "${OPTIMISM_QUICKNODE_LINK}"
scroll = "${SCROLL_RPC_URL}"
base = "${BASE_QUICKNODE_LINK}"
sepolia = "${SEPOLIA_RPC_URL}"
mantle = "${MANTLE_QUICKNODE_LINK}"
