# Name of this GitHub Actions workflow.
name: Run Semgrep

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request: {}
  # On-demand
  workflow_dispatch: {}

jobs:
  semgrep:
    # User-definable name of this GitHub Actions job:
    name: Scan
    # If you are self-hosting, change the following `runs-on` value:
    runs-on: ubuntu-latest
    # Needed to upload the SARIF report to code scanning
    permissions:
      contents: read
      security-events: write
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep:1.183.0

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with GitHub Actions Checkout.
      - uses: actions/checkout@v4.4.0
      # Fetch generic rules
      - name: Fetch generic semgrep rules
        uses: actions/checkout@v4.4.0
        with:
          repository: decurity/semgrep-smart-contracts
          path: rules
      # Fetch Compound rules
      - name: Fetch Compound semgrep rules
        uses: actions/checkout@v4.4.0
        with:
          repository: decurity/compound-semgrep-rules
          path: compound
      # Full scan with security, performance & Compound specific rules. `semgrep ci` would only scan
      # lines changed by the PR; `scan` reports every finding. Findings are printed in this log and saved
      # to the SARIF file. The job fails on Semgrep errors (bad rule, crash), not on findings.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config rules/solidity/security
          --config rules/solidity/performance
          --config compound/solidity
          --exclude rules
          --exclude compound
          --exclude forge
          --exclude contracts/test
          --exclude contracts/vendor
          --exclude contracts/liquidator
          --exclude contracts/capo
          --metrics=off
          --text
          --sarif-output=semgrep.sarif
      # Upload findings to GitHub Advanced Security Dashboard
      - name: Upload findings to GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: semgrep.sarif
        if: always()
