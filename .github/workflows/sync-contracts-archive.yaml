name: Sync Contracts Archive

on:
  schedule:
    - cron: '0 3 1,15 * *'  # ~biweekly: 1st and 15th of every month, 03:00 UTC
  workflow_dispatch:

env:
  ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
  ETHERSCAN_KEY_FOR_OPTIMISM: ${{ secrets.ETHERSCAN_KEY_FOR_OPTIMISM }}
  ETHERSCAN_KEY_FOR_BASE: ${{ secrets.ETHERSCAN_KEY_FOR_BASE }}
  ETHERSCAN_KEY_FOR_ARBITRUM: ${{ secrets.ETHERSCAN_KEY_FOR_ARBITRUM }}
  ETHERSCAN_KEY_FOR_POLYGON: ${{ secrets.ETHERSCAN_KEY_FOR_POLYGON }}
  ETHERSCAN_KEY_FOR_LINEA: ${{ secrets.ETHERSCAN_KEY_FOR_LINEA }}
  INFURA_KEY: ${{ secrets.INFURA_KEY }}
  MAINNET_QUICKNODE_LINK: ${{ secrets.MAINNET_QUICKNODE_LINK }}
  RONIN_QUICKNODE_LINK: ${{ secrets.RONIN_QUICKNODE_LINK }}
  POLYGON_QUICKNODE_LINK: ${{ secrets.POLYGON_QUICKNODE_LINK }}
  OPTIMISM_QUICKNODE_LINK: ${{ secrets.OPTIMISM_QUICKNODE_LINK }}
  MANTLE_QUICKNODE_LINK: ${{ secrets.MANTLE_QUICKNODE_LINK }}
  BASE_QUICKNODE_LINK: ${{ secrets.BASE_QUICKNODE_LINK }}
  ARBITRUM_QUICKNODE_LINK: ${{ secrets.ARBITRUM_QUICKNODE_LINK }}
  _TENDERLY_KEY_POLYGON: ${{ secrets._TENDERLY_KEY_POLYGON }}
  _TENDERLY_KEY_RONIN: ${{ secrets._TENDERLY_KEY_RONIN }}
  POLYGONSCAN_KEY: ${{ secrets.POLYGONSCAN_KEY }}
  BASESCAN_KEY: ${{ secrets.BASESCAN_KEY }}
  OPTIMISMSCAN_KEY: ${{ secrets.OPTIMISMSCAN_KEY }}
  MANTLESCAN_KEY: ${{ secrets.MANTLESCAN_KEY }}
  SCROLLSCAN_KEY: ${{ secrets.SCROLLSCAN_KEY }}
  UNICHAIN_QUICKNODE_LINK: ${{ secrets.UNICHAIN_QUICKNODE_LINK }}
  LINEA_QUICKNODE_LINK: ${{ secrets.LINEA_QUICKNODE_LINK }}

jobs:
  sync:
    name: Spider all markets and archive new contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install packages
        run: yarn install --non-interactive --frozen-lockfile

      - name: Compile
        run: yarn build

      # No --bases: spiders every configured base (every network/deployment) concurrently.
      - name: Spider all markets
        env:
          DEBUG: true
        run: yarn hardhat scenario:spider

      # Anything under deployments/*/.contracts not already in the archive submodule is new —
      # either fetched live because the archive didn't have it, or a genuinely new deployment.
      - name: Find contracts missing from the archive
        id: diff
        run: |
          changed=false
          for net_dir in deployments/*/; do
            network=$(basename "$net_dir")
            [ -d "${net_dir}.contracts" ] || continue
            archive_dir="plugins/import/contracts-archive/${network}/.contracts"
            mkdir -p "$archive_dir"
            for f in "${net_dir}.contracts"/*.json; do
              [ -e "$f" ] || continue
              dest="${archive_dir}/$(basename "$f")"
              if [ ! -f "$dest" ]; then
                cp "$f" "$dest"
                changed=true
              fi
            done
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open and merge archive PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTRACTS_ARCHIVE_TOKEN }}
        run: |
          cd plugins/import/contracts-archive
          branch="archive-sync/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .
          count=$(git diff --cached --name-only | wc -l)
          git commit -m "chore: archive $count contract(s) from comet-markets run ${{ github.run_id }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/woof-software/comet-contracts-archive.git" "HEAD:refs/heads/$branch"
          gh pr create \
            --repo woof-software/comet-contracts-archive \
            --base develop \
            --head "$branch" \
            --title "chore: archive $count contract(s) from comet-markets" \
            --body "Automated sync from comet-markets run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh pr merge "$branch" --repo woof-software/comet-contracts-archive --squash --delete-branch
