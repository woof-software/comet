name: Sync Contracts Archive

on:
  schedule:
    - cron: '0 3 1,15 * *'  # ~biweekly: 1st and 15th of every month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # archive-pr reads the spider jobs' results for the PR description

jobs:
  # Compiles once and builds the market list, so the spider jobs don't each compile
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.set-matrix.outputs.bases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            .yarn/cache
            .yarn/__virtual__
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install packages
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --non-interactive --frozen-lockfile

      - name: Compile
        run: yarn build

      # Every configured market except the local `development` one, which has nothing to spider
      - id: set-matrix
        name: Generate market list
        run: |
          RESULT=$(node -r hardhat/register -r ts-node/register/transpile-only scripts/multistream/generateCiMatrix.ts)
          echo "bases=$(echo "$RESULT" | jq -c '.bases | map(select(. != "development"))')" >> "$GITHUB_OUTPUT"

      - name: Upload compiled state
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            artifacts/
            build/
            cache/
          include-hidden-files: true

  # One job per market: a failing market is shown red on its own and doesn't stop the others
  spider:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJson(needs.prepare.outputs.bases) }}
    name: Spider (${{ matrix.base }})
    runs-on: ubuntu-latest
    env:
      ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
      ETHERSCAN_KEY_FOR_OPTIMISM: ${{ secrets.ETHERSCAN_KEY_FOR_OPTIMISM }}
      ETHERSCAN_KEY_FOR_BASE: ${{ secrets.ETHERSCAN_KEY_FOR_BASE }}
      ETHERSCAN_KEY_FOR_ARBITRUM: ${{ secrets.ETHERSCAN_KEY_FOR_ARBITRUM }}
      ETHERSCAN_KEY_FOR_POLYGON: ${{ secrets.ETHERSCAN_KEY_FOR_POLYGON }}
      ETHERSCAN_KEY_FOR_LINEA: ${{ secrets.ETHERSCAN_KEY_FOR_LINEA }}
      MAINNET_QUICKNODE_LINK: ${{ secrets.MAINNET_QUICKNODE_LINK }}
      RONIN_QUICKNODE_LINK: ${{ secrets.RONIN_QUICKNODE_LINK }}
      POLYGON_QUICKNODE_LINK: ${{ secrets.POLYGON_QUICKNODE_LINK }}
      OPTIMISM_QUICKNODE_LINK: ${{ secrets.OPTIMISM_QUICKNODE_LINK }}
      MANTLE_QUICKNODE_LINK: ${{ secrets.MANTLE_QUICKNODE_LINK }}
      BASE_QUICKNODE_LINK: ${{ secrets.BASE_QUICKNODE_LINK }}
      ARBITRUM_QUICKNODE_LINK: ${{ secrets.ARBITRUM_QUICKNODE_LINK }}
      UNICHAIN_QUICKNODE_LINK: ${{ secrets.UNICHAIN_QUICKNODE_LINK }}
      LINEA_QUICKNODE_LINK: ${{ secrets.LINEA_QUICKNODE_LINK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download compiled state
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: .

      - name: Restore node_modules cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            .yarn/cache
            .yarn/__virtual__
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install packages
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --non-interactive --frozen-lockfile

      - name: Spider
        env:
          DEBUG: true
        run: yarn hardhat scenario:spider --bases "${{ matrix.base }}"

      # Only reached when the spider passed, so a failed market adds nothing to the PR.
      # Kept as <network>/.contracts/<address>.json (the path after the first wildcard).
      - name: Upload spidered contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ matrix.base }}
          path: deployments/*/.contracts/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  # Runs even when some markets failed: the PR gets the contracts from every market that passed
  archive-pr:
    needs: [ prepare, spider ]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    name: Open archive PR
    runs-on: ubuntu-latest
    steps:
      # The archive submodule URL is SSH (git@github.com:...); only actions/checkout knows how to
      # clone it over HTTPS with the job token, so the submodules must be cloned here
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compare against the latest archive, not the commit comet points to: that one is behind
      # after every sync, so the PR would re-add already archived files and conflict with develop.
      # The submodule checkout has no remote-tracking branches, so the fetch lands in FETCH_HEAD.
      - name: Check out latest archive develop
        run: |
          cd plugins/import/contracts-archive
          git fetch origin develop
          git checkout FETCH_HEAD

      - name: Download spidered contracts
        uses: actions/download-artifact@v4
        with:
          pattern: contracts-*
          path: collected

      - name: Find contracts missing from the archive
        id: diff
        run: |
          mkdir -p collected
          added=$(sh scripts/archive/collect-new-contracts.sh collected plugins/import/contracts-archive)
          echo "Contracts added: $added"
          echo "added=$added" >> "$GITHUB_OUTPUT"

      - name: List passed and failed markets
        id: markets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json jobs)
          passed=$(echo "$jobs" | jq -r '[.jobs[] | select(.name | startswith("Spider (")) | select(.conclusion == "success") | .name[8:-1]] | join(", ")')
          failed=$(echo "$jobs" | jq -r '[.jobs[] | select(.name | startswith("Spider (")) | select(.conclusion != "success") | .name[8:-1]] | join(", ")')
          echo "passed=${passed:-none}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed:-none}" >> "$GITHUB_OUTPUT"
          echo "Passed: ${passed:-none}"
          echo "Failed: ${failed:-none}"

      - name: Open and merge archive PR
        if: steps.diff.outputs.added != '0'
        env:
          GH_TOKEN: ${{ secrets.CONTRACTS_ARCHIVE_TOKEN }}
          PASSED: ${{ steps.markets.outputs.passed }}
          FAILED: ${{ steps.markets.outputs.failed }}
        run: |
          # Secret pasted with a trailing newline breaks the push URL
          GH_TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')
          export GH_TOKEN
          cd plugins/import/contracts-archive
          branch="archive-sync/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .
          count=$(git diff --cached --name-only | wc -l)
          git commit -m "chore: archive $count contract(s) from comet-markets run ${{ github.run_id }}"
          # Drop the GITHUB_TOKEN auth header persisted by actions/checkout so the URL token is used
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/woof-software/comet-contracts-archive.git" "HEAD:refs/heads/$branch"
          gh pr create \
            --repo woof-software/comet-contracts-archive \
            --base develop \
            --head "$branch" \
            --title "chore: archive $count contract(s) from comet-markets" \
            --body "Automated sync from comet-markets run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Markets included: $PASSED
          Markets failed (not included): $FAILED"
          gh pr merge "$branch" --repo woof-software/comet-contracts-archive --squash --delete-branch
